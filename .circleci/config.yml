version: 2
workflows:
  version: 2
  build-workflow:
    jobs:
      - build:
          context: github
jobs:
  build:
    docker:
      - image: cimg/go:1.23
    environment:
      HUGO_VERSION: 0.164.0
    steps:
      - checkout
      - run:
          name: install
          command: |
            sudo apt update
            sudo apt install -y git
            curl -fsSL -o /tmp/hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
            sudo dpkg -i /tmp/hugo.deb
            hugo version
      # processed images (resources/_gen) are expensive to regenerate; reuse across builds
      - restore_cache:
          keys:
            - hugo-resources-v1-{{ .Branch }}-
            - hugo-resources-v1-
      - run:
          name: sync git repo
          command: |
            git clone --depth 1 https://github.com/joway/blog.git public
            find ./public -not -name '.git' -mindepth 1 -maxdepth 1 -print0 | xargs -0 rm -rf --
      - run:
          name: build site
          command: |
            make site
      - save_cache:
          key: hugo-resources-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - resources/_gen
      - run:
          name: setup git
          command: |
            git config --global credential.helper 'cache --timeout=120'
            git config --global user.email "joway.w@gmail.com"
            git config --global user.name "Joway.CI"
      - run:
          name: push theme yinyang
          command: |
            export msg=$(git log --pretty=format:%s -1)
            git clone --depth 1 https://github.com/joway/hugo-theme-yinyang.git yinyang
            find ./yinyang -not -name '.git' -mindepth 1 -maxdepth 1 -print0 | xargs -0 rm -rf --
            cp -r ./themes/yinyang/* ./yinyang
            cd ./yinyang
            if [ -n "$(git status --porcelain)" ]; then
              git add .
              git commit --allow-empty -m "$msg"
              git push -q https://${GITHUB_TOKEN}@github.com/joway/hugo-theme-yinyang.git master --force
            else
              echo "no changes";
            fi
            cd ..
      - deploy:
          name: push newest site
          command: |
            export msg=$(git log --pretty=format:%s -1)
            cd public
            cp index.xml atom.xml
            if [ -n "$(git status --porcelain)" ]; then
              git add .
              git commit --allow-empty -m "$msg"
              git push -q https://${GITHUB_TOKEN}@github.com/joway/blog.git master --force
            else
              echo "no changes";
            fi
    # The resource_class feature allows configuring CPU and RAM resources for each job. Different resource classes are available for different executors. https://circleci.com/docs/2.0/configuration-reference/#resourceclass
    resource_class: large
